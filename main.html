<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyBookList</title>
</head>
<body>

  <h1>MyBookList</h1>

  <div class="form-group">
    <form id="book-form">
      <label>Title</label>
      <input type="text" id="title">

      <label>Author</label>
      <input type="text" id="author">

      <label>ISBN#</label>
      <input type="text" id="isbn">

      <input type="submit" id="submit" value="Add Book">
    </form>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN#</th>
        <th></th>
      </tr>
    </thead>

    <tbody id="book-list">
    </tbody>
  </table>

  <script src="./script.js"></script>
</body>
</html>
